id = "dev.ariel.herdr-alerts"
name = "Status Alerts"
version = "0.1.0"
min_herdr_version = "0.9.3"
description = "Sound, flash and optional sprites when agents finish or need attention."
platforms = ["macos", "linux"]

[[build]]
command = ["sh", "./scripts/build/install.sh"]

[[build]]
command = ["sh", "./scripts/build/generate-alert-tables.sh"]

[[events]]
on = "pane.agent_status_changed"
command = ["zsh", "./hooks/on-pane-agent-status-changed-alert.zsh"]

[[actions]]
id = "alerts"
title = "List the named alerts"
command = ["./bin/herdr-alert", "list"]

[[actions]]
id = "play"
title = "Preview sound, flash and sprite"
command = ["./bin/herdr-alert", "play"]
contexts = ["pane", "workspace"]
